<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Loops in Threads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose: #d8a7b1;
            --rose-dark: #b8818e;
            --blush: #f4c2c2;
            --cream: #fff8f5;
            --text: #2c1f22;
            --muted: #8c6b72;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            background: var(--cream);
            color: var(--text);
        }

        /* Left panel */
        .auth-visual {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: linear-gradient(145deg, #f4c2c2 0%, #d8a7b1 100%);
            padding: 60px 40px; position: relative; overflow: hidden;
        }
        .auth-visual-blob {
            position: absolute; width: 500px; height: 500px;
            border-radius: 50%; background: rgba(255,255,255,0.15);
            top: -100px; left: -100px;
        }
        .auth-visual-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; color: white; text-align: center;
            position: relative; z-index: 1;
        }
        .auth-visual-logo span { display: block; font-size: 1rem; font-family: 'DM Sans', sans-serif; font-weight: 300; margin-top: 8px; opacity: .85; }
        .auth-visual-imgs {
            display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
            margin-top: 40px; position: relative; z-index: 1;
        }
        .auth-visual-imgs img {
            width: 130px; height: 145px; border-radius: 14px;
            object-fit: cover; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            transition: transform .3s;
        }
        .auth-visual-imgs img:hover { transform: scale(1.05); }
        .auth-visual-imgs img:nth-child(2) { margin-top: 20px; }

        /* Right panel */
        .auth-form-panel {
            width: 480px; display: flex; flex-direction: column;
            justify-content: center; padding: 60px 52px;
            background: white;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--muted); text-decoration: none; font-size: .85rem;
            margin-bottom: 40px; transition: color .2s;
        }
        .back-link:hover { color: var(--rose-dark); }
        .auth-form-panel h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; margin-bottom: 6px;
        }
        .auth-form-panel h2 em { color: var(--rose-dark); font-style: italic; }
        .auth-form-panel .subtitle { color: var(--muted); font-size: .95rem; margin-bottom: 36px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: .82rem; font-weight: 500; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 13px 16px;
            border: 1.5px solid #e8d5d8; border-radius: 10px;
            font-family: 'DM Sans', sans-serif; font-size: .95rem;
            color: var(--text); background: #fafafa;
            transition: border-color .2s, box-shadow .2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--rose);
            box-shadow: 0 0 0 3px rgba(216,167,177,0.15);
            background: white;
        }

        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; font-size: .85rem; }
        .form-options label { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
        .form-options a { color: var(--rose-dark); text-decoration: none; }
        .form-options a:hover { text-decoration: underline; }

        .btn-submit {
            width: 100%; padding: 14px;
            background: var(--rose); color: white; border: none;
            border-radius: 10px; font-family: 'DM Sans', sans-serif;
            font-size: 1rem; font-weight: 500; cursor: pointer;
            transition: background .2s, transform .2s, box-shadow .2s;
            box-shadow: 0 6px 20px rgba(216,167,177,0.4);
        }
        .btn-submit:hover { background: var(--rose-dark); transform: translateY(-1px); box-shadow: 0 10px 28px rgba(216,167,177,0.5); }

        .divider-or { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--muted); font-size: .85rem; }
        .divider-or::before, .divider-or::after { content: ''; flex: 1; height: 1px; background: #e8d5d8; }

        .btn-social {
            width: 100%; padding: 12px; border: 1.5px solid #e8d5d8;
            border-radius: 10px; background: white; font-family: 'DM Sans', sans-serif;
            font-size: .9rem; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 10px; transition: border-color .2s, background .2s;
        }
        .btn-social:hover { border-color: var(--rose); background: #fff8f5; }

        .signup-link { text-align: center; margin-top: 24px; font-size: .88rem; color: var(--muted); }
        .signup-link a { color: var(--rose-dark); text-decoration: none; font-weight: 500; }
        .signup-link a:hover { text-decoration: underline; }

        .error-msg { color: #c0392b; font-size: .82rem; margin-top: 6px; display: none; }

        @media (max-width: 800px) {
            body { flex-direction: column; }
            .auth-visual { display: none; }
            .auth-form-panel { width: 100%; padding: 48px 28px; }
        }
    </style>
</head>
<body>

<div class="auth-visual">
    <div class="auth-visual-blob"></div>
    <div class="auth-visual-logo">
        Loops in Threads
        <span>Handmade Crochet Creations</span>
    </div>
    <div class="auth-visual-imgs">
        <img src="images/bag.jpg" alt="Crochet bag">
        <img src="images/doll.jpg" alt="Crochet doll">
        <img src="images/keychain.jpg" alt="Crochet keychain">
        <img src="images/top.jpg" alt="Crochet top">
    </div>
</div>

<div class="auth-form-panel">
    <a href="index.html" class="back-link">← Back to Home</a>

    <h2>Welcome <em>back</em></h2>
    <p class="subtitle">Login to your account to track orders and more.</p>

    <div id="loginForm">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com">
            <p class="error-msg" id="emailError">Please enter a valid email.</p>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
            <p class="error-msg" id="passError">Password must be at least 6 characters.</p>
        </div>

        <div class="form-options">
            <label><input type="checkbox"> Remember me</label>
            <a href="#">Forgot password?</a>
        </div>

        <button class="btn-submit" onclick="handleLogin()">Login</button>

        <div class="divider-or">or</div>

        <button class="btn-social" onclick="socialLogin()">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M44.5 20H24v8.5h11.7C34.1 34.1 29.6 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.9 0 20-7.8 20-21 0-1.4-.1-2.7-.5-4z"/></svg>
            Continue with Google
        </button>
    </div>

    <p class="signup-link">Don't have an account? <a href="signup.html">Sign up</a></p>
</div>

<script>
    function handleLogin() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        let valid = true;

        const emailErr = document.getElementById('emailError');
        const passErr = document.getElementById('passError');

        emailErr.style.display = 'none';
        passErr.style.display = 'none';

        if (!email.includes('@') || !email.includes('.')) {
            emailErr.style.display = 'block'; valid = false;
        }
        if (pass.length < 6) {
            passErr.style.display = 'block'; valid = false;
        }
        if (valid) {
            alert('Login successful! Welcome back to Loops in Threads 🧶');
            window.location.href = 'index.html';
        }
    }
    function socialLogin() {
        alert('Google sign-in coming soon!');
    }
</script>
</body>
</html>
